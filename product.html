<script>
const id=getParam('id')||PRODUCTS[0].id;
const p=PRODUCTS.find(x=>x.id===id)||PRODUCTS[0];
document.title=`${p.name} — Aditi`;
const mainImg = p.image || (p.variants && p.variants[0] && p.variants[0].image) || '';
const gallery = mainImg
  ? `<img id="pd-img" src="${mainImg}" alt="${p.name}">`
  : `${p.name}<br><span style="font-weight:400;font-size:14px">Image placeholder — replace with product photography</span>`;
const variantsHTML = p.variants ? `<label>Select Color</label><div class="variant-row">${p.variants.map((v,i)=>`<div class="variant ${i===0?'selected':''}" data-img="${v.image}">${v.name}</div>`).join('')}</div>` : '';
document.getElementById('pd').innerHTML=`
<div class="pd-gallery">${gallery}</div>
<div class="pd-info"><div class="card-cat">${p.category} • ${p.tag}</div><h1>${p.name}</h1>
<div class="pd-price">₹${p.price.toLocaleString('en-IN')}</div>
<p>${p.desc}</p>
${variantsHTML}
<div class="btn-row"><a class="btn btn-primary" href="contact.html?enquire=${p.id}">Enquire About This Piece</a><a class="btn btn-secondary" href="shop.html">Continue Browsing</a></div>
<table class="spec-table"><tr><td>Fabric</td><td>${p.fabric}</td></tr><tr><td>Color</td><td>${p.color}</td></tr><tr><td>Available Sizes</td><td>42 (M), 44 (L), 46 (XL)</td></tr><tr><td>Care</td><td>Dry clean recommended for hand embroidery</td></tr></table>
</div>`;
document.querySelectorAll('.variant').forEach(v=>v.onclick=()=>{document.querySelectorAll('.variant').forEach(x=>x.classList.remove('selected'));v.classList.add('selected');const img=document.getElementById('pd-img'); if(img) img.src=v.dataset.img;});
document.getElementById('rel').innerHTML=PRODUCTS.filter(x=>x.id!==p.id).slice(0,4).map(cardHTML).join('');
</script>
